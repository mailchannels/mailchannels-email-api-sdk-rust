name: Rust SDK validation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - rust:1.88.0-slim-bookworm@sha256:38bc5a86d998772d4aec2348656ed21438d20fcdce2795b56ca434cf21430d89
          - rust:1.90.0-slim-bookworm@sha256:64232e656c058f4468e8d024e990acff04f0fd5a5c0a88a574dc37773d7325c9
          - rust:1.99.0-slim-bookworm@sha256:2c3a22f0a5533ea2dd5a16627bc841228151faa2d4de2644ac9987e4a2f1f2fa
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python -m pip install cryptography==45.0.3
      - run: bash scripts/test.sh
        env:
          SDK_RUST_IMAGE: ${{ matrix.image }}
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python -m pip install PyYAML==6.0.3
      - run: bash scripts/regenerate.sh && git diff --exit-code
      - run: docker run --rm -v "$PWD:/sdk" -w /sdk visibility-rust-checks:1.90.0 cargo clippy --locked --lib -- -D warnings
      - run: docker run --rm -v "$PWD:/sdk" -w /sdk visibility-rust-checks:1.90.0 cargo package --locked
      - run: docker build -f scripts/RustAudit.Dockerfile -t visibility-rust-audit:0.22.2 scripts
      - run: docker run --rm -v "$PWD:/sdk:ro" -w /sdk visibility-rust-audit:0.22.2 cargo audit
